name: Build portable FloatNote.exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the exe to a release on tags

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # Pure-logic Rust tests (LRC parser, lyrics providers, settings) run without the Windows toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests
        run: |
          mkdir -p /tmp/logic/src
          cp src-tauri/src/lrc.rs src-tauri/src/lyrics.rs src-tauri/src/settings.rs src-tauri/src/update.rs /tmp/logic/src/
          printf 'pub mod lrc;\npub mod lyrics;\npub mod settings;\npub mod update;\n' > /tmp/logic/src/lib.rs
          printf '[package]\nname="logic"\nversion="0.0.0"\nedition="2021"\n[dependencies]\nserde={version="1",features=["derive"]}\nserde_json="1"\nreqwest={version="0.12",default-features=false,features=["json","rustls-tls"]}\n' > /tmp/logic/Cargo.toml
          cd /tmp/logic && cargo test

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build (no installer)
        run: npm run app:build
      - name: Name the zip after the version
        shell: pwsh
        run: |
          $v = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match the app version v$v (src-tauri/Cargo.toml, tauri.conf.json, package.json)"
          }
          "ZIP=FloatNote-v$v-portable.zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Collect exe
        shell: pwsh
        run: Copy-Item src-tauri/target/release/floatnote.exe FloatNote.exe
      # Pure native Tauri build without post-link rcedit tampering to avoid Chrome Safe Browsing heuristics
      - name: Zip and checksums
        shell: pwsh
        run: |
          Compress-Archive FloatNote.exe $env:ZIP -Force
          $lines = foreach ($f in 'FloatNote.exe', $env:ZIP) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash)  $f"
          }
          $lines | Out-File sha256.txt -Encoding ascii
      # archive: false uploads the zip as-is: FloatNote-vX.Y.Z-portable.zip with only FloatNote.exe inside
      # (the exe keeps one stable name so shortcuts, pins and startup entries survive updates).
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP }}
          archive: false
      - name: Publish release (tags like v1.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ZIP }}
            sha256.txt
