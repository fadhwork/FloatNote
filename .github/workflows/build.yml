name: Build portable FloatNote.exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the exe to a release on tags

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # Pure-logic Rust tests (LRC parser, settings) run without the Windows toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests
        run: |
          mkdir -p /tmp/logic/src
          cp src-tauri/src/lrc.rs src-tauri/src/settings.rs /tmp/logic/src/
          printf 'pub mod lrc;\npub mod settings;\n' > /tmp/logic/src/lib.rs
          printf '[package]\nname="logic"\nversion="0.0.0"\nedition="2021"\n[dependencies]\nserde={version="1",features=["derive"]}\nserde_json="1"\n' > /tmp/logic/Cargo.toml
          cd /tmp/logic && cargo test

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build (no installer)
        run: npm run app:build
      - name: Package portable exe
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/floatnote.exe FloatNote.exe
          "$((Get-FileHash FloatNote.exe -Algorithm SHA256).Hash)  FloatNote.exe" | Out-File sha256.txt -Encoding ascii
      # archive: false uploads the exe as-is, so the download is FloatNote.exe itself (no zip around it).
      - uses: actions/upload-artifact@v7
        with:
          path: FloatNote.exe
          archive: false
      - name: Publish release (tags like v1.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            FloatNote.exe
            sha256.txt
