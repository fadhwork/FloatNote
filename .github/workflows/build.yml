name: Build portable FloatNote.exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the exe to a release on tags

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # Pure-logic Rust tests (LRC parser, settings) run without the Windows toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit tests
        run: |
          mkdir -p /tmp/logic/src
          cp src-tauri/src/lrc.rs src-tauri/src/settings.rs /tmp/logic/src/
          printf 'pub mod lrc;\npub mod settings;\n' > /tmp/logic/src/lib.rs
          printf '[package]\nname="logic"\nversion="0.0.0"\nedition="2021"\n[dependencies]\nserde={version="1",features=["derive"]}\nserde_json="1"\n' > /tmp/logic/Cargo.toml
          cd /tmp/logic && cargo test

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build (no installer)
        run: npm run app:build
      - name: Collect exe
        shell: pwsh
        run: Copy-Item src-tauri/target/release/floatnote.exe FloatNote.exe
      # Fills in Properties -> Details (product, description, publisher, copyright, version).
      # Best effort: if the download fails the build still succeeds with Tauri's defaults.
      - name: Set file details
        shell: pwsh
        continue-on-error: true
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Invoke-WebRequest https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -OutFile rcedit.exe
          ./rcedit.exe FloatNote.exe `
            --set-file-version $ver --set-product-version $ver `
            --set-version-string ProductName "FloatNote" `
            --set-version-string FileDescription "FloatNote - synced lyrics overlay" `
            --set-version-string CompanyName "fadhlihsani" `
            --set-version-string LegalCopyright "Copyright (c) 2026 fadhlihsani" `
            --set-version-string OriginalFilename "FloatNote.exe" `
            --set-version-string InternalName "FloatNote"
          (Get-Item FloatNote.exe).VersionInfo | Format-List ProductName, FileDescription, CompanyName, LegalCopyright, FileVersion
      - name: Zip and checksums
        shell: pwsh
        run: |
          Compress-Archive FloatNote.exe FloatNote-portable.zip -Force
          $lines = foreach ($f in 'FloatNote.exe','FloatNote-portable.zip') {
            "$((Get-FileHash $f -Algorithm SHA256).Hash)  $f"
          }
          $lines | Out-File sha256.txt -Encoding ascii
      # archive: false uploads the zip as-is: the download is FloatNote-portable.zip with only FloatNote.exe inside.
      - uses: actions/upload-artifact@v7
        with:
          path: FloatNote-portable.zip
          archive: false
      - name: Publish release (tags like v1.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            FloatNote-portable.zip
            sha256.txt
