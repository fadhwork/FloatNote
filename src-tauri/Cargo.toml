[package]
name = "floatnote"
version = "1.1.0"
description = "FloatNote - floating, click-through synced lyrics overlay"
authors = ["fadhlihsani"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "floatnote_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls: no OpenSSL, so the exe stays self-contained.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Media_Control"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
