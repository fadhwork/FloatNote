<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FloatNote</title>
  </head>
  <body class="locked-off">
    <div id="panel" class="panel"></div>
    <main id="lyrics" aria-live="polite"></main>
    <div id="status"></div>

    <div id="toolbar" class="ctl" data-hit>
      <button id="prevBtn" title="Previous track">⏮</button>
      <button id="nextBtn" title="Next track">⏭</button>
      <span class="sep"></span>
      <button id="lock" title="Click-through (Ctrl+Alt+L to undo)">Lock</button>
      <button id="gear" title="Settings">⚙</button>
    </div>

    <div id="handle" class="ctl" data-hit title="Drag to move">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <div id="timing" class="ctl" data-hit>
      <button id="playBtn" title="Play / Pause">⏯</button>
      <span class="sep"></span>
      <button data-d="-3000" title="Lyrics 3 s later">−3s</button>
      <button data-d="-1000" title="Lyrics 1 s later">−1s</button>
      <button id="offset" title="Click to reset to 0">0</button>
      <button data-d="1000" title="Lyrics 1 s sooner">+1s</button>
      <button data-d="3000" title="Lyrics 3 s sooner">+3s</button>
    </div>

    <div id="grip" class="ctl" data-hit title="Drag to resize"></div>
    <div id="toast"></div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
