<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FloatNote</title>
  </head>
  <body>
    <!-- The glass display: only lyrics live in here, so it can shrink to a single line. -->
    <div id="display">
      <div id="panel" class="panel"></div>
      <main id="lyrics" aria-live="polite"></main>
      <div id="status"></div>
      <div id="handle" class="ctl" data-hit title="Drag to move"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div id="grip" class="ctl" data-hit title="Drag to resize"></div>
      <div id="toast"></div>
    </div>

    <!-- Controls sit below the display, outside it. -->
    <div id="controls">
      <div id="timing" class="ctl" data-hit>
        <button data-d="-3000" title="Lyrics 3 s later">−3s</button>
        <button data-d="-1000" title="Lyrics 1 s later">−1s</button>
        <button id="offset" title="Click to reset to 0">0</button>
        <button data-d="1000" title="Lyrics 1 s sooner">+1s</button>
        <button data-d="3000" title="Lyrics 3 s sooner">+3s</button>
      </div>
      <div id="music" class="ctl" data-hit>
        <button id="prevBtn" class="ico" title="Previous track" aria-label="Previous track">
          <svg viewBox="0 0 24 24"><path d="M6 5h2.2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button id="playBtn" class="ico big" title="Play / Pause" aria-label="Play or pause">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>
        </button>
        <button id="nextBtn" class="ico" title="Next track" aria-label="Next track">
          <svg viewBox="0 0 24 24"><path d="M15.8 5H18v14h-2.2zM4 5v14l11-7z"/></svg>
        </button>
        <span class="sep"></span>
        <button id="lock" title="Click-through">Lock</button>
        <button id="gear" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </div>

    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
